<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EyePTV Digital Cable</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="logo"><span class="eye">◉</span> EyePTV</div>
    <div class="provider">DIGITAL CABLE</div>
    <div id="clock"></div>
  </header>

  <div class="main">
    <section class="guide-pane">
      <div class="guide-title">TV GUIDE</div>
      <div class="daybar">
        <button id="prevDay">◀</button>
        <span id="dayLabel"></span>
        <button id="nextDay">▶</button>
      </div>
      <div class="grid-wrap">
        <div id="guide"></div>
      </div>
    </section>

    <aside class="preview-pane">
      <div class="preview-screen">
        <video id="video" playsinline muted></video>
        <div id="previewPlaceholder">EYEPTV<br><small>SELECT A PROGRAM</small></div>
        <div id="previewBanner"></div>
      </div>
      <div class="channel-card">
        <div id="channelNo">000</div>
        <div>
          <div id="channelName">NO CHANNEL SELECTED</div>
          <div id="programName">Select a program from the guide</div>
        </div>
      </div>
      <button id="watch">WATCH FULL SCREEN</button>
      <div class="help">
        <b>SELECT</b> Program &nbsp; <b>OK</b> Tune &nbsp; <b>GUIDE</b> Return to Guide<br>
        <b>▲▼</b> Channel &nbsp; <b>◀▶</b> Browse Programs
      </div>
    </aside>
  </div>

  <div class="bottom-bar">
    <span>INFO</span><span>OK SELECT</span><span>EXIT</span><span>GUIDE</span>
    <span id="status">DEMO GUIDE</span>
  </div>
</div>

<div id="fullscreen">
  <video id="fullVideo" controls playsinline></video>
  <div id="fullBlack"></div>
  <div id="channelBanner">
    <div class="bigNo" id="fullNo">000</div>
    <div class="bannerText">
      <div id="fullChannel">EyePTV</div>
      <div id="fullProgram">Select a channel</div>
      <div id="fullDesc"></div>
    </div>
  </div>
  <div id="fullHint">PRESS GUIDE TO RETURN TO TV GUIDE</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script src="app.js"></script>
</body>
</html>
